<svg xmlns="http://www.w3.org/2000/svg" width="420" height="180" viewBox="0 0 420 180" role="img" aria-label="Contribution streak">

<style>
  .bg { fill: #ffffff; stroke: #d0d7de; }
  .title { font: 600 17px 'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif; fill: #4f46e5; }
  .label { font: 400 13px 'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif; fill: #57606a; }
  .value { font: 700 15px 'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif; fill: #1f2328; }
  .big { font: 700 28px 'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif; fill: #1f2328; }
  .small { font: 400 11px 'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif; fill: #8c959f; }
  .accent { fill: #2da44e; }
  .icon { fill: #4f46e5; }
  .track { fill: #eaeef2; }
  .ring-track { stroke: #eaeef2; }
  .divider { stroke: #d0d7de; }
  .l0 { fill: #ebedf0; } .l1 { fill: #9be9a8; } .l2 { fill: #40c463; } .l3 { fill: #30a14e; } .l4 { fill: #216e39; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #0d1117; stroke: #30363d; }
    .title { fill: #a5b4fc; }
    .label { fill: #9198a1; }
    .value, .big { fill: #f0f6fc; }
    .small { fill: #6e7681; }
    .accent { fill: #3fb950; }
    .icon { fill: #a5b4fc; }
    .track { fill: #21262d; }
    .ring-track { stroke: #21262d; }
    .divider { stroke: #30363d; }
    .l0 { fill: #161b22; } .l1 { fill: #0e4429; } .l2 { fill: #006d32; } .l3 { fill: #26a641; } .l4 { fill: #39d353; }
  }
</style>
<rect class="bg" x="0.5" y="0.5" rx="10" width="419" height="179"/>
<text class="title" x="24" y="36">Contribution streak</text>
<line class="divider" x1="140" y1="62" x2="140" y2="152" stroke-width="1"/>
<line class="divider" x1="280" y1="62" x2="280" y2="152" stroke-width="1"/>
<text class="big" x="70" y="104" text-anchor="middle">563</text>
<text class="label" x="70" y="128" text-anchor="middle">Contributions</text>
<text class="small" x="70" y="146" text-anchor="middle">last 12 months</text>
<circle class="ring-track" cx="210" cy="96" r="27" fill="none" stroke-width="5"/>
<circle cx="210" cy="96" r="27" fill="none" stroke="#2da44e" stroke-width="5" stroke-linecap="round" stroke-dasharray="1.9 999" transform="rotate(-90 210 96)"/>
<text class="big" x="210" y="105" text-anchor="middle">1</text>
<text class="label" x="210" y="146" text-anchor="middle" style="font-weight:600">Current streak</text>
<text class="big" x="350" y="104" text-anchor="middle">91</text>
<text class="label" x="350" y="128" text-anchor="middle">Longest streak</text>
<text class="small" x="350" y="146" text-anchor="middle">Feb 23 – May 24</text>
<text class="small" x="396" y="36" text-anchor="end">214 active days</text>
</svg>