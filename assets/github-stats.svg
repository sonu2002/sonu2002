<svg xmlns="http://www.w3.org/2000/svg" width="420" height="180" viewBox="0 0 420 180" role="img" aria-label="GitHub stats">

<style>
  .bg { fill: #ffffff; stroke: #d0d7de; }
  .title { font: 600 17px 'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif; fill: #4f46e5; }
  .label { font: 400 13px 'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif; fill: #57606a; }
  .value { font: 700 15px 'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif; fill: #1f2328; }
  .big { font: 700 28px 'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif; fill: #1f2328; }
  .small { font: 400 11px 'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif; fill: #8c959f; }
  .accent { fill: #2da44e; }
  .icon { fill: #4f46e5; }
  .track { fill: #eaeef2; }
  .ring-track { stroke: #eaeef2; }
  .divider { stroke: #d0d7de; }
  .l0 { fill: #ebedf0; } .l1 { fill: #9be9a8; } .l2 { fill: #40c463; } .l3 { fill: #30a14e; } .l4 { fill: #216e39; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #0d1117; stroke: #30363d; }
    .title { fill: #a5b4fc; }
    .label { fill: #9198a1; }
    .value, .big { fill: #f0f6fc; }
    .small { fill: #6e7681; }
    .accent { fill: #3fb950; }
    .icon { fill: #a5b4fc; }
    .track { fill: #21262d; }
    .ring-track { stroke: #21262d; }
    .divider { stroke: #30363d; }
    .l0 { fill: #161b22; } .l1 { fill: #0e4429; } .l2 { fill: #006d32; } .l3 { fill: #26a641; } .l4 { fill: #39d353; }
  }
</style>
